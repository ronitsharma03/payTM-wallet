name: Build and deploy to Docker Hub


on: 
  push: 
    branches: 
      - master
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Check Out Repo
      uses: actions/checkout@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{secrets.DOCKER_USERNAME}}
        password: ${{secrets.Docker_PASSWORD}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v2
      with: 
        context: .
        file: ./docker/Dockerfile.user
        push: true
        tags: devxronit/paytm-user-app:latest

    - name: Verify pushed Image
      run: docker pull devxronit/paytm-user-app:latest

    - name: Deploy to EC2 Server
      uses: appleboy/ssh-action@master
      with: 
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          sudo docker pull devxronit/paytm-user-app:latest
          sudo docker stop user-app || true
          sudo docker rm user-app || true
          sudo docker run -e DATABASE_URL=${{ secrets.DB_URL }} JWT_SECRET=${{ secrets.JWT_SECRET }} NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }} -d --name user-app -p 3005:3000 devxronit/paytm-user-app:latest